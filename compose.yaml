# Stack applicative (PostgreSQL, API Symfony / Apache, UI statique).
# Ce fichier ne contient pas Traefik : sur le Raspberry Pi, Traefik est installé
# à part et pointe vers les ports publiés ci‑dessous (voir .env.docker.example).
#
# 1) Copier .env.docker.example vers .env et renseigner les secrets.
# 2) docker compose up --build
# 3) Données de référence (premier déploiement) : docker compose exec php php bin/console app:pokechill:import-reference-data

services:
  database:
    image: postgres:${POSTGRES_VERSION:-16}-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_USER: ${POSTGRES_USER:-app}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-app}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    environment:
      APP_ENV: prod
      APP_DEBUG: "0"
      APP_SECRET: ${APP_SECRET:?set APP_SECRET in .env}
      DATABASE_URL: postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB:-app}?serverVersion=16&charset=utf8
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "${API_HTTP_PORT:-8081}:80"
    volumes:
      - backend_var:/var/www/html/var
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    ports:
      - "${UI_HTTP_PORT:-8080}:8080"
    restart: unless-stopped

volumes:
  postgres_data:
  backend_var:
