# Stack applicative (PostgreSQL, API Symfony / Apache, UI statique).
#
# Avec Traefik (réseau Docker externe `traefik`) : un seul FQDN, routage
#   /api/*  → service php (Apache)
#   /*      → service frontend (miniserve)
# Définir POKECHILL_FQDN dans .env (ex. pokechill.example.com) et créer le DNS chez Cloudflare.
#
# 1) Copier .env.docker.example vers .env et renseigner les secrets + POKECHILL_FQDN.
# 2) docker compose up --build
# 3) Données de référence (premier déploiement) : définir POKECHILL_SOURCE_URL dans .env puis
#    docker compose exec php php bin/console app:pokechill:import-reference-data

networks:
  traefik:
    external: true
    name: traefik

services:
  database:
    image: postgres:${POSTGRES_VERSION:-16}-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_USER: ${POSTGRES_USER:-app}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-app}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    environment:
      APP_ENV: prod
      APP_DEBUG: "0"
      APP_SECRET: ${APP_SECRET:?set APP_SECRET in .env}
      DATABASE_URL: postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB:-app}?serverVersion=16&charset=utf8
      POKECHILL_SOURCE_URL: ${POKECHILL_SOURCE_URL:?set POKECHILL_SOURCE_URL in .env}
    depends_on:
      database:
        condition: service_healthy
    volumes:
      - backend_var:/var/www/html/var
    networks:
      - default
      - traefik
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik
      - traefik.http.routers.pokechill-api.rule=Host(`${POKECHILL_FQDN:-pokechill.example.com}`) && PathPrefix(`/api`)
      - traefik.http.routers.pokechill-api.entrypoints=websecure
      - traefik.http.routers.pokechill-api.tls=true
      - traefik.http.routers.pokechill-api.tls.certresolver=letsencrypt
      - traefik.http.routers.pokechill-api.priority=100
      - traefik.http.services.pokechill-api.loadbalancer.server.port=80
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    networks:
      - default
      - traefik
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik
      - traefik.http.routers.pokechill-ui.rule=Host(`${POKECHILL_FQDN:-pokechill.example.com}`)
      - traefik.http.routers.pokechill-ui.entrypoints=websecure
      - traefik.http.routers.pokechill-ui.tls=true
      - traefik.http.routers.pokechill-ui.tls.certresolver=letsencrypt
      - traefik.http.routers.pokechill-ui.priority=10
      - traefik.http.services.pokechill-ui.loadbalancer.server.port=8080
    restart: unless-stopped

volumes:
  postgres_data:
  backend_var:
